<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background dark rounded square -->
  <rect width="32" height="32" rx="6" fill="#131313"/>
  <!-- Orange accent bar top -->
  <rect x="4" y="4" width="24" height="3" rx="1" fill="#f26b3a"/>
  <!-- Camera lens circle -->
  <circle cx="16" cy="18" r="7" stroke="#f26b3a" stroke-width="1.5" fill="none"/>
  <circle cx="16" cy="18" r="4" fill="#242424" stroke="#f26b3a" stroke-width="1"/>
  <circle cx="16" cy="18" r="1.5" fill="#f26b3a"/>
  <!-- Lens glare -->
  <circle cx="13" cy="15" r="1" fill="#f26b3a" opacity="0.5"/>
</svg>
