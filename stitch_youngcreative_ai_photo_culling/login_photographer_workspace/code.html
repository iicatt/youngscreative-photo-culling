<!DOCTYPE html>

          'FILL' 0,
          'wght' 400,
          'GRAD' 0,
          'opsz' 24
        }
        
        /* Custom Ambient Glow for Form Container */
        .ambient-glow {
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.15);
        }
    </style>

        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-tertiary-container": "#00323e",

                        "primary": "#ffb59c",

                        "on-primary-fixed-variant": "#832700",

                        "surface-variant": "#353534",

                        "surface": "#131313",
                        "on-secondary-fixed": "#281800",
                        "surface-container-lowest": "#0e0e0e",

                        "secondary": "#e0c298",
                        "on-secondary-container": "#ceb188",
                        "tertiary": "#5dd5f8",

                        "inverse-surface": "#e5e2e1",

                        "secondary-fixed": "#fedeb2",
                        "primary-fixed-dim": "#ffb59c",
                        "text-primary": "#F3F4F6",
                        "on-background": "#e5e2e1",
                        "outline": "#a78a81"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "unit-1": "0.25rem",
                        "gutter": "1px",
                        "bento-gap": "12px",
                        "margin-mobile": "16px",
                        "unit-2": "0.5rem",
                        "margin-desktop": "24px",
                        "unit-4": "1rem",
                        "unit-8": "2rem",
                        "base": "4px"
                    },
                    "fontFamily": {

<body class="bg-background text-text-primary min-h-screen flex items-center justify-center relative overflow-hidden font-body-md text-body-md">
<!-- Cinematic Background Element -->
<div class="absolute inset-0 z-0 opacity-30 pointer-events-none" data-alt="A highly atmospheric, out-of-focus cinematic shot of a vintage camera lens reflecting subtle neon studio lights. The image is dominated by deep charcoal blacks and subtle dark greys, with soft, bokeh highlights adding a technical, professional mood. The overall aesthetic is dark, minimalist, and highly polished, suitable for a high-end photography workspace background." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAKDnBO3hl91_lkB2NLAaonGyd4y4ajlvfs9Ion-W6UE2qzq8AIagybCRIZ-LruTVouk_wA-RgmfMCTcRZtdWGMHjxEF3bkj4e-GSkvGSKUVstFAhfwJvqrDlmBF3zFUpyVYNfd7tvxfUdy45wPX8ztrogc_YlqC6mNgos3wphooibTcraqupZM5sb2A4tKqcYBz2erH2By9vNhcSrciZB3ka2ujkTM_YnQ7BMnh9rybG9TXLEPCTkq')"></div>
<!-- Subtle Grid Overlay for Utilitarian Feel -->
<div class="absolute inset-0 z-0 pointer-events-none bg-[linear-gradient(to_right,#333333_1px,transparent_1px),linear-gradient(to_bottom,#333333_1px,transparent_1px)] bg-[size:4rem_4rem] [mask-image:radial-gradient(ellipse_60%_60%_at_50%_50%,#000_10%,transparent_100%)] opacity-20"></div>
<!-- Login Container (Bento Cell) -->
<main class="relative z-10 w-full max-w-md px-margin-mobile md:px-0">
<div class="bg-surface-dark border border-border-dark ambient-glow p-unit-8 rounded-lg flex flex-col gap-unit-8">
<!-- Branding Header -->
<div class="text-center flex flex-col gap-unit-2">
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-primary-fixed-dim">YoungCreative</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Pro Workspace Login</p>
</div>
<!-- Form -->
<form class="flex flex-col gap-unit-4" onsubmit="event.preventDefault(); window.location.href='#';">
<!-- Email Field -->
<div class="flex flex-col gap-base">
<label class="font-label-sm text-label-sm text-text-muted uppercase" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-text-muted" style="font-size: 18px;">mail</span>
<input class="w-full bg-[#1a1a1a] border border-border-dark text-text-primary font-body-md text-body-md rounded pl-10 pr-4 py-2 focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors placeholder:text-text-muted/50" id="email" name="email" placeholder="photographer@studio.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-base">
<div class="flex justify-between items-center">
<label class="font-label-sm text-label-sm text-text-muted uppercase" for="password">Password</label>
<a class="font-mono-label text-mono-label text-on-surface-variant hover:text-primary-fixed-dim transition-colors" href="#">Forgot?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-text-muted" style="font-size: 18px;">lock</span>
<input class="w-full bg-[#1a1a1a] border border-border-dark text-text-primary font-body-md text-body-md rounded pl-10 pr-4 py-2 focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Actions -->
<div class="mt-unit-4 flex flex-col gap-unit-4">
<button class="w-full bg-primary-container text-white font-label-sm text-label-sm uppercase py-3 rounded hover:bg-inverse-primary transition-colors flex items-center justify-center gap-2" type="submit">
                        Sign in as Photographer
                        <span class="material-symbols-outlined" style="font-size: 18px;">arrow_forward</span>
</button>
<button class="w-full bg-transparent border border-border-dark text-text-primary font-label-sm text-label-sm uppercase py-3 rounded hover:bg-surface-container-high transition-colors" type="button">
                        Request Client Access
                    </button>
</div>
</form>
<!-- Footer Links -->
<div class="text-center border-t border-border-dark pt-unit-4 mt-unit-2">
<p class="font-mono-label text-mono-label text-text-muted">
                    Secured by YoungCreative Core
                </p>
</div>
</div>
</main>
</body></html>
